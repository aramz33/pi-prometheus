# Grafana datasource provisioning for examples/docker-compose.yml.
# The uid is fixed because the shipped dashboards are rewritten to point at it
# (see the dashboard-prep service in docker-compose.yml).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: pi-prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
